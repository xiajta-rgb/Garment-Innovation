<svg xmlns="http://www.w3.org/2000/svg" width="2500" height="1600" viewBox="0 0 2500 1600"><rect width="100%" height="100%" fill="#fff"/><rect x="0" y="0" width="2500" height="160" fill="#506c38"/><text x="40" y="58" font-size="40" fill="#fff" font-weight="700" font-family="Microsoft YaHei,Arial,sans-serif">男士卫衣 · 基款继承校正轮设计矩阵</text><text x="40" y="108" font-size="24" fill="#e4eee5" font-family="Microsoft YaHei,Arial,sans-serif">AT25M3295 · 证据 → 机会判断 → 设计动作 → 验证闸门 · candidate-only</text><text x="58" y="202" font-size="24" font-weight="700" fill="#29352f" font-family="Microsoft YaHei,Arial,sans-serif">方案</text><text x="298" y="202" font-size="24" font-weight="700" fill="#29352f" font-family="Microsoft YaHei,Arial,sans-serif">基款保留与主变化</text><text x="808" y="202" font-size="24" font-weight="700" fill="#29352f" font-family="Microsoft YaHei,Arial,sans-serif">证据与机会判断</text><text x="1568" y="202" font-size="24" font-weight="700" fill="#29352f" font-family="Microsoft YaHei,Arial,sans-serif">验证闸门 / 边界</text><text x="2208" y="202" font-size="24" font-weight="700" fill="#29352f" font-family="Microsoft YaHei,Arial,sans-serif">状态</text><rect x="0" y="160" width="2500" height="355" fill="#fff" stroke="#d6dfd8"/><line x1="280" y1="160" x2="280" y2="515" stroke="#d6dfd8"/><line x1="790" y1="160" x2="790" y2="515" stroke="#d6dfd8"/><line x1="1550" y1="160" x2="1550" y2="515" stroke="#d6dfd8"/><line x1="2190" y1="160" x2="2190" y2="515" stroke="#d6dfd8"/><text x="58" y="242" font-size="26" fill="#29352f" font-family="Microsoft YaHei,Arial,sans-serif">S0 · AT25M329</text><text x="58" y="277" font-size="26" fill="#29352f" font-family="Microsoft YaHei,Arial,sans-serif">5 原稿基线</text><text x="298" y="242" font-size="22" fill="#29352f" font-family="Microsoft YaHei,Arial,sans-serif">保留：微落肩、圆领、长袖、净面无袋；55mm 宽 </text><text x="298" y="273" font-size="22" fill="#29352f" font-family="Microsoft YaHei,Arial,sans-serif">2×2 罗纹袖口与下摆；原稿正背比例和侧面袖体量。</text><text x="298" y="304" font-size="22" fill="#29352f" font-family="Microsoft YaHei,Arial,sans-serif">变化：无</text><text x="808" y="242" font-size="22" fill="#29352f" font-family="Microsoft YaHei,Arial,sans-serif">这是基准对照，不构成创新机会主张。它的价值是确认我司基款被正确继承，并为</text><text x="808" y="273" font-size="22" fill="#29352f" font-family="Microsoft YaHei,Arial,sans-serif"> S1/S2 的单变量归因提供对照。 状态：baseline-only</text><text x="1568" y="242" font-size="22" fill="#29352f" font-family="Microsoft YaHei,Arial,sans-serif">设计复核前置。逐项对照正面、背面、侧面和宽罗纹表达 → 记录</text><text x="1568" y="273" font-size="22" fill="#29352f" font-family="Microsoft YaHei,Arial,sans-serif">领条、罗纹、缝份和针距等未闭合字段 → 由授权责任人确认是否</text><text x="1568" y="304" font-size="22" fill="#29352f" font-family="Microsoft YaHei,Arial,sans-serif">达到基款继承要求。任一锁定 DNA 未被继承则退回修正；原稿</text><text x="1568" y="335" font-size="22" fill="#29352f" font-family="Microsoft YaHei,Arial,sans-serif">、净样或责任人未补齐时保持 baseline-only。</text><text x="2208" y="242" font-size="22" fill="#65736a" font-family="Microsoft YaHei,Arial,sans-serif">baseline-only</text><rect x="0" y="515" width="2500" height="355" fill="#f7faf7" stroke="#d6dfd8"/><line x1="280" y1="515" x2="280" y2="870" stroke="#d6dfd8"/><line x1="790" y1="515" x2="790" y2="870" stroke="#d6dfd8"/><line x1="1550" y1="515" x2="1550" y2="870" stroke="#d6dfd8"/><line x1="2190" y1="515" x2="2190" y2="870" stroke="#d6dfd8"/><text x="58" y="597" font-size="26" fill="#29352f" font-family="Microsoft YaHei,Arial,sans-serif">S1 · 轻材料同版型</text><text x="298" y="597" font-size="22" fill="#29352f" font-family="Microsoft YaHei,Arial,sans-serif">保留：AT25M3295 全部轮廓、圆领、肩袖、净</text><text x="298" y="628" font-size="22" fill="#29352f" font-family="Microsoft YaHei,Arial,sans-serif">面无袋和 55mm 罗纹关系。变化：只替换主体材料</text><text x="298" y="659" font-size="22" fill="#29352f" font-family="Microsoft YaHei,Arial,sans-serif">为 FC063 260g 候选</text><text x="808" y="597" font-size="22" fill="#29352f" font-family="Microsoft YaHei,Arial,sans-serif">这是当前最值得做的材料单项机会候选：它把评论中的材料不一致、洗后保持和表</text><text x="808" y="628" font-size="22" fill="#29352f" font-family="Microsoft YaHei,Arial,sans-serif">面质量问题转成可验证假设，同时保留我司版型语法。证据支持“值得做对照”，</text><text x="808" y="659" font-size="22" fill="#29352f" font-family="Microsoft YaHei,Arial,sans-serif">尚不支持“较轻一定更舒适”或“市场机会已成立”。 状态：candidat</text><text x="808" y="690" font-size="22" fill="#29352f" font-family="Microsoft YaHei,Arial,sans-serif">e-opportunity</text><text x="1568" y="597" font-size="22" fill="#29352f" font-family="Microsoft YaHei,Arial,sans-serif">材料单项样衣前置。冻结 S0/S1 同版型、同尺码和同结构对</text><text x="1568" y="628" font-size="22" fill="#29352f" font-family="Microsoft YaHei,Arial,sans-serif">照 → 成对检查主体—罗纹伸长回弹、洗缩、缝口平整、起球和落</text><text x="1568" y="659" font-size="22" fill="#29352f" font-family="Microsoft YaHei,Arial,sans-serif">毛 → 做同体型日常层搭与办公场景对照试穿 → 回写成本、可</text><text x="1568" y="690" font-size="22" fill="#29352f" font-family="Microsoft YaHei,Arial,sans-serif">得性和商品判断。只有真实对照记录、授权测试条件、责任人结论和</text><text x="1568" y="721" font-size="22" fill="#29352f" font-family="Microsoft YaHei,Arial,sans-serif">商品成本判断同时形成后，才可讨论保留；关键证据缺失则保持 c</text><text x="1568" y="752" font-size="22" fill="#29352f" font-family="Microsoft YaHei,Arial,sans-serif">andidate-opportunity。</text><text x="2208" y="597" font-size="22" fill="#506c38" font-family="Microsoft YaHei,Arial,sans-serif">candidate-oppor</text><text x="2208" y="628" font-size="22" fill="#506c38" font-family="Microsoft YaHei,Arial,sans-serif">tunity</text><rect x="0" y="870" width="2500" height="355" fill="#fff" stroke="#d6dfd8"/><line x1="280" y1="870" x2="280" y2="1225" stroke="#d6dfd8"/><line x1="790" y1="870" x2="790" y2="1225" stroke="#d6dfd8"/><line x1="1550" y1="870" x2="1550" y2="1225" stroke="#d6dfd8"/><line x1="2190" y1="870" x2="2190" y2="1225" stroke="#d6dfd8"/><text x="58" y="952" font-size="26" fill="#29352f" font-family="Microsoft YaHei,Arial,sans-serif">S2 · 微对比罗纹同版型</text><text x="298" y="952" font-size="22" fill="#29352f" font-family="Microsoft YaHei,Arial,sans-serif">保留：AT25M3295 轮廓、圆领、肩袖、净面无</text><text x="298" y="983" font-size="22" fill="#29352f" font-family="Microsoft YaHei,Arial,sans-serif">袋、主身材料和罗纹高度。变化：只提出领、袖口和下摆</text><text x="298" y="1014" font-size="22" fill="#29352f" font-family="Microsoft YaHei,Arial,sans-serif">的微对比视觉关系</text><text x="808" y="952" font-size="22" fill="#29352f" font-family="Microsoft YaHei,Arial,sans-serif">这是视觉差异假设，不是已被市场证实的机会。它可以检验“保留我司卫衣骨架、</text><text x="808" y="983" font-size="22" fill="#29352f" font-family="Microsoft YaHei,Arial,sans-serif">只改变收口对比”是否提高识别度或偏好，但当前没有直接需求结果证据。 状态</text><text x="808" y="1014" font-size="22" fill="#29352f" font-family="Microsoft YaHei,Arial,sans-serif">：visual-hypothesis-only</text><text x="1568" y="952" font-size="22" fill="#29352f" font-family="Microsoft YaHei,Arial,sans-serif">视觉提案审查。先以同版型视觉稿确认对比强度和基款识别 → 补</text><text x="1568" y="983" font-size="22" fill="#29352f" font-family="Microsoft YaHei,Arial,sans-serif">齐配套罗纹来源与色号 → 再做小范围偏好/选款记录和洗后色彩</text><text x="1568" y="1014" font-size="22" fill="#29352f" font-family="Microsoft YaHei,Arial,sans-serif">检查 → 根据责任人结论决定回退或进入下一轮。在视觉、供应链</text><text x="1568" y="1045" font-size="22" fill="#29352f" font-family="Microsoft YaHei,Arial,sans-serif">、色牢度和偏好证据没有同时闭合前，保持 visual-hyp</text><text x="1568" y="1076" font-size="22" fill="#29352f" font-family="Microsoft YaHei,Arial,sans-serif">othesis-only，不送入当前设计台。</text><text x="2208" y="952" font-size="22" fill="#80633e" font-family="Microsoft YaHei,Arial,sans-serif">visual-hypothes</text><text x="2208" y="983" font-size="22" fill="#80633e" font-family="Microsoft YaHei,Arial,sans-serif">is-only</text><rect x="0" y="1225" width="2500" height="355" fill="#f7faf7" stroke="#d6dfd8"/><line x1="280" y1="1225" x2="280" y2="1580" stroke="#d6dfd8"/><line x1="790" y1="1225" x2="790" y2="1580" stroke="#d6dfd8"/><line x1="1550" y1="1225" x2="1550" y2="1580" stroke="#d6dfd8"/><line x1="2190" y1="1225" x2="2190" y2="1580" stroke="#d6dfd8"/><text x="58" y="1307" font-size="26" fill="#29352f" font-family="Microsoft YaHei,Arial,sans-serif">Q0 · 半拉链方向（暂不</text><text x="58" y="1342" font-size="26" fill="#29352f" font-family="Microsoft YaHei,Arial,sans-serif">落图）</text><text x="298" y="1307" font-size="22" fill="#29352f" font-family="Microsoft YaHei,Arial,sans-serif">保留：保留半拉链作为待核研究问题；保留 AT25M</text><text x="298" y="1338" font-size="22" fill="#29352f" font-family="Microsoft YaHei,Arial,sans-serif">3295 作为未来对照基款。变化：待来源补齐后，单</text><text x="298" y="1369" font-size="22" fill="#29352f" font-family="Microsoft YaHei,Arial,sans-serif">独建立领部结构轴和材料轴的分步对照</text><text x="808" y="1307" font-size="22" fill="#29352f" font-family="Microsoft YaHei,Arial,sans-serif">半拉链仍是需要研究的市场方向，但当前不能认定为市场白地或公司新增机会。现</text><text x="808" y="1338" font-size="22" fill="#29352f" font-family="Microsoft YaHei,Arial,sans-serif">有证据同时出现趋势反例、我司已有相关构型和结构来源缺口，因此先阻断落图，</text><text x="808" y="1369" font-size="22" fill="#29352f" font-family="Microsoft YaHei,Arial,sans-serif">待补齐来源后再做结构对照。 状态：blocked-pending-sou</text><text x="808" y="1400" font-size="22" fill="#29352f" font-family="Microsoft YaHei,Arial,sans-serif">rce-pattern</text><text x="1568" y="1307" font-size="22" fill="#29352f" font-family="Microsoft YaHei,Arial,sans-serif">结构开发来源门禁。先核实我司既有构型与具体版本 → 建立领部</text><text x="1568" y="1338" font-size="22" fill="#29352f" font-family="Microsoft YaHei,Arial,sans-serif">裁片和配缝清单 → 在公司版型骨架上做单结构对照 → 再做样</text><text x="1568" y="1369" font-size="22" fill="#29352f" font-family="Microsoft YaHei,Arial,sans-serif">衣、试穿和拉链/洗后验证。来源结构、责任人和真实样衣未补齐前</text><text x="1568" y="1400" font-size="22" fill="#29352f" font-family="Microsoft YaHei,Arial,sans-serif">，保持 blocked-pending-source-pat</text><text x="1568" y="1431" font-size="22" fill="#29352f" font-family="Microsoft YaHei,Arial,sans-serif">tern；市场趋势不能解除该阻断。</text><text x="2208" y="1307" font-size="22" fill="#a52d25" font-family="Microsoft YaHei,Arial,sans-serif">blocked-pending</text><text x="2208" y="1338" font-size="22" fill="#a52d25" font-family="Microsoft YaHei,Arial,sans-serif">-source-pattern</text></svg>