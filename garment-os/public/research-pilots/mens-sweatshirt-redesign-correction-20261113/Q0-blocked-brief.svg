<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1060" viewBox="0 0 1500 1060"><rect width="1500" height="1060" fill="#fff"/><rect x="20" y="20" width="1460" height="1020" rx="12" fill="none" stroke="#a8a8a8" stroke-width="5"/><rect x="20" y="20" width="1460" height="54" fill="#506c38"/><text x="50" y="58" font-size="31" fill="#fff" font-family="Microsoft YaHei">结构开发单 · 暂不落图</text><text x="70" y="170" font-size="34" fill="#a52d25" font-family="Microsoft YaHei">半拉链方向被阻断</text><text x="70" y="235" font-size="22" fill="#29352f" font-family="Microsoft YaHei">基款：AT25M3295 微落肩圆领罗纹卫衣</text><text x="70" y="300" font-size="22" fill="#29352f" font-family="Microsoft YaHei">缺少：我司半拉链原稿 / 净样 / 领部配套结构 / 责任人</text><text x="70" y="365" font-size="22" fill="#29352f" font-family="Microsoft YaHei">必须补齐：领面领底、贴边或领座、开口止点、挡片、护颏、末端加固</text><text x="70" y="430" font-size="22" fill="#29352f" font-family="Microsoft YaHei">当前动作：保持市场假设，暂停结构落图；不送入设计台，不计入生产候选</text><text x="70" y="560" font-size="20" fill="#80633e" font-family="Microsoft YaHei">这是研究边界和开发输入单，不是完成的款式图或纸样。</text><text x="70" y="920" font-size="18" fill="#65736a" font-family="Microsoft YaHei">来源：AT25M3295 原稿、AT25M3288 原稿、男士卫衣研究轮次 2026-11-13</text></svg>